version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cotu-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-cotu}
      - POSTGRES_USER=${DB_USER:-cotu_admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./init-tenants.sql:/docker-entrypoint-initdb.d/01-init-tenants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cotu_admin} -d ${DB_NAME:-cotu}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cotu-net

  api:
    image: cotu-api:prod
    container_name: cotu-api
    restart: unless-stopped
    build:
      context: ..
      dockerfile: src/ArchiFlow.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-cotu}
      - DB_USER=${DB_USER:-cotu_admin}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-Cotu}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-CotuClients}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES:-480}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME:-Administrador Geral}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@cotu.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Cotu}
      - SMTP_ENABLE_SSL=${SMTP_ENABLE_SSL:-true}
      - GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID:-}
      - GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AllowedOrigins=https://${DOMAIN_NAME},https://www.${DOMAIN_NAME},https://app.${DOMAIN_NAME},https://staging.${DOMAIN_NAME},https://duna.${DOMAIN_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cotu-net

  api-app:
    image: cotu-api:app
    container_name: cotu-api-app
    restart: unless-stopped
    build:
      context: ../../ArchiFlow.Admin.API
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-cotu}
      - DB_USER=${DB_USER:-cotu_admin}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-Cotu}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-CotuClients}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES:-480}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME:-Administrador Geral}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@cotu.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Cotu}
      - SMTP_ENABLE_SSL=${SMTP_ENABLE_SSL:-true}
      - GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID:-}
      - GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AllowedOrigins=https://${DOMAIN_NAME},https://www.${DOMAIN_NAME},https://app.${DOMAIN_NAME},https://staging.${DOMAIN_NAME},https://duna.${DOMAIN_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cotu-net

  api-staging:
    image: cotu-api:staging
    container_name: cotu-api-staging
    restart: unless-stopped
    build:
      context: ..
      dockerfile: src/ArchiFlow.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-cotu}
      - DB_USER=${DB_USER:-cotu_admin}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-Cotu}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-CotuClients}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES:-480}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME:-Administrador Geral}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@cotu.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Cotu}
      - SMTP_ENABLE_SSL=${SMTP_ENABLE_SSL:-true}
      - GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID:-}
      - GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AllowedOrigins=https://${DOMAIN_NAME},https://www.${DOMAIN_NAME},https://app.${DOMAIN_NAME},https://staging.${DOMAIN_NAME},https://duna.${DOMAIN_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cotu-net

  web:
    image: cotu-web:prod
    container_name: cotu-web
    restart: unless-stopped
    build:
      context: ../../ArchiFlow
      dockerfile: Dockerfile
    networks:
      - cotu-net

  web-staging:
    image: cotu-web:staging
    container_name: cotu-web-staging
    restart: unless-stopped
    build:
      context: ../../ArchiFlow
      dockerfile: Dockerfile
    networks:
      - cotu-net

  admin:
    image: cotu-admin:prod
    container_name: cotu-admin
    restart: unless-stopped
    build:
      context: ../../ArchiFlow.Admin
      dockerfile: Dockerfile
    networks:
      - cotu-net

  landing:
    image: cotu-landing:prod
    container_name: cotu-landing
    restart: unless-stopped
    build:
      context: ../../ArchiFlow.Landing
      dockerfile: Dockerfile
    networks:
      - cotu-net

  proxy:
    image: caddy:2-alpine
    container_name: cotu-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - api-app
      - api-staging
      - web
      - web-staging
      - admin
      - landing
    networks:
      - cotu-net

volumes:
  pgdata_prod:
  caddy_data:
  caddy_config:

networks:
  cotu-net:
    driver: bridge
